<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1b1b1c;
      --body: #3c4642;
      --muted: #5a6660;
      --faint: #8a968a;
      --meta: #9AA59C;
      --line: #EFF2EF;
      --rail: #E2E7E2;
      --border: #DDE2DD;
      --soft: #F4F6F4;
      --panel: #FAFBFA;
      --teal: #36A191;
      --teal-text: #297A6E;
      --teal-soft: #E9F4F1;
      --cred: #1F6E5E;
      --add-bg: #E3F3EE;
      --add-ink: #1F5E55;
      --del-bg: #FCEDEC;
      --del-ink: #B42318;
      --mono: 'Azeret Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic UI', Meiryo, sans-serif;
      color: var(--ink); background: #ffffff; -webkit-font-smoothing: antialiased;
    }
    button, select { font-family: inherit; }
    button { cursor: pointer; }

    .modal { display: flex; flex-direction: column; height: 100%; }

    /* ---------- 見出し ---------- */
    .m-head { display: flex; align-items: flex-start; gap: 16px; padding: 16px 24px 20px 32px; border-bottom: 1px solid var(--line); }
    .m-title { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
    .eyebrow { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
    .title-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .title-row h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .01em; }
    .chip { font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 2px 8px; background: var(--soft); border-radius: 6px; }
    .origin { font-size: 11.5px; color: var(--faint); }
    .m-actions { display: flex; align-items: center; gap: 10px; flex: none; padding-top: 6px; }
    .filter-label { font-size: 12px; font-weight: 600; color: var(--body); }
    .filter {
      height: 34px; min-width: 200px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px;
      background: #ffffff; font-size: 12.5px; color: var(--ink);
    }
    .filter:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(54, 161, 145, .16); }

    /* ---------- タイムライン ---------- */
    .list { flex: 1; min-height: 0; overflow: auto; padding: 8px 24px 20px 32px; }
    .event {
      display: grid; grid-template-columns: 128px 20px minmax(0, 1fr); column-gap: 16px;
      padding: 10px 8px; margin-left: -8px; border-radius: 10px;
    }
    .event:hover { background: var(--panel); }
    .event.focus, .event.focus:hover { background: var(--teal-soft); }

    .when { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding-top: 4px; white-space: nowrap; }
    .when .date { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--ink); }
    .when .time { font-family: var(--mono); font-size: 11px; color: var(--faint); }

    .rail { display: flex; flex-direction: column; align-items: center; align-self: stretch; }
    .dot { flex: none; margin-top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--teal); }
    .dot.REC, .dot.ROW { background: #ffffff; border: 2.5px solid #B5BEB7; }
    .rail-line { flex: 1; width: 1.5px; margin-top: 6px; margin-bottom: -26px; background: var(--rail); }
    .event.last .rail-line { display: none; }

    .content { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .ev-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 24px; }
    .ev-type { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--teal-text); }
    .ev-type.REC, .ev-type.ROW { color: var(--muted); }
    .ev-editor { font-size: 12.5px; font-weight: 600; color: var(--ink); }
    .ev-row { font-size: 11px; color: var(--meta); font-family: var(--mono); }

    .changes { display: flex; flex-direction: column; gap: 6px; }
    .change { display: grid; grid-template-columns: 160px minmax(0, 1fr); column-gap: 14px; align-items: start; }
    .c-name { font-size: 12px; font-weight: 600; color: var(--body); padding-top: 2px; overflow-wrap: anywhere; }
    .c-diff { padding: 4px 10px; background: var(--soft); border-radius: 7px; max-width: 760px; }
    .c-text { font-size: 12.5px; line-height: 1.75; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
    .c-text.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
    .c-arrow { margin: 0 6px; color: var(--faint); }
    .c-text del { text-decoration: line-through; color: var(--del-ink); background: var(--del-bg); border-radius: 3px; padding: 0 1px; }
    .c-text ins { text-decoration: none; color: var(--add-ink); background: var(--add-bg); border-radius: 3px; padding: 0 1px; font-weight: 600; }
    .c-tag { display: inline-block; margin-right: 6px; font-size: 10.5px; font-weight: 600; color: var(--faint); }
    .c-more {
      grid-column: 2; justify-self: start; margin-top: 2px; padding: 0; border: none; background: none;
      font-size: 11.5px; font-weight: 600; color: var(--teal-text); display: flex; align-items: center; gap: 4px;
    }
    .c-more:hover { text-decoration: underline; }
    .c-more.open svg { transform: rotate(180deg); }
    .no-change { font-size: 12px; color: var(--faint); }

    .snap-toggle {
      align-self: flex-start; height: 26px; padding: 0 10px; border: 1px solid var(--border); border-radius: 7px;
      background: #ffffff; font-size: 11.5px; font-weight: 600; color: var(--body);
      display: flex; align-items: center; gap: 5px;
    }
    .snap-toggle:hover { background: var(--soft); }
    .snap-toggle.open svg { transform: rotate(180deg); }
    .snap-toggle:focus-visible, .c-more:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(54, 161, 145, .25); }

    .snapshot {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px 16px;
      padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #ffffff;
    }
    .s-item { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 4px 6px; border-radius: 6px; }
    .s-item.changed { background: var(--teal-soft); }
    .s-key { font-size: 11px; color: var(--faint); }
    .s-val { font-size: 12.5px; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }

    .notice { margin: 14px 0 0 144px; font-size: 11.5px; color: var(--faint); }
    .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 13px; text-align: center; padding: 24px; }
    .empty strong { color: var(--ink); font-size: 15px; }

    /* ---------- 読み込み中 ---------- */
    .loading {
      position: fixed; inset: 0; z-index: 20; background: rgba(255, 255, 255, .96);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      color: var(--muted); font-size: 13px;
    }
    .loading p { margin: 0; }
    .loading small { color: var(--meta); font-size: 12px; min-height: 1.2em; }
    .spinner { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--rail); border-top-color: var(--teal); }
    .loading.error .spinner { display: none; }
    .loading.error p { color: var(--del-ink); }
    .btn { height: 34px; padding: 0 16px; border: 1px solid var(--border); border-radius: 8px; background: #ffffff; font-size: 12.5px; font-weight: 600; }
    .btn:hover { background: var(--soft); }

    @media (prefers-reduced-motion: reduce) {
      *:not(.spinner) { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body data-sheet="<?= sheetName ?>" data-row="<?= row ?>" data-customer="<?= customer ?>"
      data-opened-width="<?= openedWidth ?>" data-opened-height="<?= openedHeight ?>"
      data-focus-event="<?= focusEventId ?>">
  <div class="loading" id="loading" role="status" aria-live="polite">
    <div class="spinner"></div>
    <p id="loadingText">変更履歴を読み込んでいます…</p>
    <small id="loadingTime"></small>
    <button type="button" class="btn" id="reload" hidden>もう一度読み込む</button>
  </div>

  <div class="modal">
    <header class="m-head">
      <div class="m-title">
        <span class="eyebrow">変更履歴</span>
        <div class="title-row">
          <h1 id="customer"></h1>
          <span class="chip" id="count"></span>
          <span class="origin" id="origin"></span>
        </div>
      </div>
      <div class="m-actions">
        <label class="filter-label" for="filter">項目</label>
        <select class="filter" id="filter"></select>
      </div>
    </header>

    <div class="list" id="list"></div>
    <div class="empty" id="empty" hidden>
      <strong id="emptyTitle">まだ変更の記録はありません</strong>
      <span id="emptyText">この行のセルが変更されると、ここに記録が表示されます。</span>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const context = {sheetName: document.body.dataset.sheet, row: Number(document.body.dataset.row)};
    $('customer').textContent = document.body.dataset.customer || '';

    let data = null;
    const openSnapshots = new Set();
    const openChanges = new Set();

    const TYPE_LABEL = {
      EVT: '編集',
      REC: '取りこぼし回収',
      ROW: '行の追加・削除時',
      DLG: 'ダイアログからの登録'
    };
    const CHEVRON = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 3.5 5 6.5 8 3.5"/></svg>';

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    /* ---------- 表示 ---------- */

    function buildFilter() {
      const names = new Set();
      data.events.forEach(ev => ev.changes.forEach(c => names.add(c.column)));
      const select = $('filter');
      const keep = select.value;
      select.textContent = '';
      select.add(new Option('すべての項目', ''));
      [...names].sort((a, b) => a.localeCompare(b, 'ja')).forEach(n => select.add(new Option(n, n)));
      select.value = [...select.options].some(o => o.value === keep) ? keep : '';
    }

    function render() {
      const filter = $('filter').value;
      const events = data.events
        .map(ev => filter ? Object.assign({}, ev, {changes: ev.changes.filter(c => c.column === filter)}) : ev)
        .filter(ev => !filter || ev.changes.length);

      $('count').textContent = events.length + '件';
      $('origin').textContent = data.sheetName + '　' + data.row + '行目';

      const list = $('list');
      list.textContent = '';
      $('empty').hidden = events.length > 0;
      list.hidden = !events.length;

      if (!events.length) {
        if (data.customerMissing) {
          $('emptyTitle').textContent = '記録を探せませんでした';
          $('emptyText').textContent = '「変更時点スナップショット」に「得意先」の列がありません。';
        } else if (filter) {
          $('emptyTitle').textContent = '「' + filter + '」の変更はありません';
          $('emptyText').textContent = '項目の選択を「すべての項目」に戻すと、ほかの変更も表示されます。';
        }
        return;
      }

      events.forEach((ev, i) => {
        const node = renderEvent(ev);
        if (i === events.length - 1) node.classList.add('last');
        list.appendChild(node);
      });
      list.appendChild(el('p', 'notice',
        '得意先「' + data.customer + '」の記録を表示しています。得意先名を変える前の記録は含まれません。' +
        (data.truncated ? '最新の記録だけを表示しています。' : '')));
      requestAnimationFrame(updateClamps);
    }

    function renderEvent(ev) {
      const row = el('div', 'event');
      row.title = 'イベントID: ' + ev.eventId;
      row.dataset.event = ev.eventId;
      if (ev.eventId === document.body.dataset.focusEvent) row.classList.add('focus');

      const [date, time] = String(ev.at || '').split(' ');
      const when = el('div', 'when');
      when.append(el('span', 'date', date || ''), el('span', 'time', time || ''));

      const rail = el('div', 'rail');
      rail.append(el('span', 'dot ' + ev.type), el('span', 'rail-line'));

      const content = el('div', 'content');
      const head = el('div', 'ev-head');
      head.append(
        el('span', 'ev-type ' + ev.type, TYPE_LABEL[ev.type] || ev.type),
        el('span', 'ev-editor', String(ev.editor || '').split('@')[0] || '不明'),
        el('span', 'ev-row', ev.rowNumber ? '当時 ' + ev.rowNumber + '行目' : '')
      );
      head.title = ev.editor || '';
      content.appendChild(head);

      const changes = el('div', 'changes');
      if (!ev.changes.length) {
        changes.appendChild(el('span', 'no-change', '変更内容の記録が見つかりませんでした（変更セル：' + (ev.cells || '—') + '）'));
      }
      ev.changes.forEach((change, index) => changes.appendChild(renderChange(ev, change, index)));
      content.appendChild(changes);

      // この時点の全項目
      const open = openSnapshots.has(ev.eventId);
      const toggle = el('button', 'snap-toggle' + (open ? ' open' : ''), open ? 'この時点の全項目を閉じる' : 'この時点の全項目');
      toggle.type = 'button';
      toggle.insertAdjacentHTML('beforeend', CHEVRON);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      toggle.addEventListener('click', () => {
        if (open) openSnapshots.delete(ev.eventId); else openSnapshots.add(ev.eventId);
        render();
      });
      content.appendChild(toggle);

      if (open) {
        const changed = new Set(ev.changes.map(c => c.column));
        const grid = el('div', 'snapshot');
        ev.snapshot.forEach(([key, value]) => {
          const item = el('div', 's-item' + (changed.has(key) ? ' changed' : ''));
          item.append(el('span', 's-key', key), el('span', 's-val', value));
          grid.appendChild(item);
        });
        if (!ev.snapshot.length) grid.appendChild(el('span', 'no-change', '記録された項目はありません'));
        content.appendChild(grid);
      }

      row.append(when, rail, content);
      return row;
    }

    /** 変更前→変更後を1つの文にまとめ、消えた文字を赤の取り消し線、増えた文字を緑で示す。 */
    function renderChange(ev, change, index) {
      const key = ev.eventId + '#' + index;
      const open = openChanges.has(key);
      const wrap = el('div', 'change');
      wrap.appendChild(el('span', 'c-name', change.column || change.cell));

      // 背景のボックスと、行数を絞る本文を分ける（余白に4行目がはみ出さないように）
      const diff = el('div', 'c-diff');
      const text = el('div', 'c-text' + (open ? '' : ' clamp'));
      diff.appendChild(text);
      if (!change.before && change.after) text.appendChild(el('span', 'c-tag', '入力'));
      else if (change.before && !change.after) text.appendChild(el('span', 'c-tag', '削除'));

      const short = change.before && change.after &&
        Math.max(change.before.length, change.after.length) <= 24 && !/\n/.test(change.before + change.after);
      if (short) {
        // 短い値（数値・日付・名前など）は「変更前 → 変更後」で見せる
        text.append(el('del', '', change.before), el('span', 'c-arrow', '→'), el('ins', '', change.after));
      } else {
        (change.parts || []).forEach(part => {
          const tag = part.kind === 'add' ? 'ins' : part.kind === 'del' ? 'del' : 'span';
          text.appendChild(el(tag, '', part.text));
        });
      }
      diff.title = '変更前：' + (change.before || '（空欄）') + '\n変更後：' + (change.after || '（空欄）');
      wrap.appendChild(diff);

      const more = el('button', 'c-more' + (open ? ' open' : ''), open ? '折りたたむ' : 'すべて表示');
      more.type = 'button';
      more.insertAdjacentHTML('beforeend', CHEVRON);
      more.hidden = true;             // 3行を超えるかは描画後に判定する
      more.dataset.open = open ? '1' : '';
      more.addEventListener('click', () => {
        if (open) openChanges.delete(key); else openChanges.add(key);
        render();
      });
      wrap.appendChild(more);
      return wrap;
    }

    function updateClamps() {
      document.querySelectorAll('.change').forEach(wrap => {
        const text = wrap.querySelector('.c-text');
        const more = wrap.querySelector('.c-more');
        more.hidden = more.dataset.open !== '1' && !(text.scrollHeight > text.clientHeight + 1);
      });
    }
    window.addEventListener('resize', updateClamps);
    $('filter').addEventListener('change', render);

    /* ---------- モーダルの大きさ（ブラウザの窓幅の 95%） ---------- */

    const DIALOG_WIDTH_RATIO = 0.95;

    function targetDialogSize() {
      const w = window.outerWidth || screen.availWidth;
      const h = window.outerHeight || screen.availHeight;
      return {
        width: Math.max(720, Math.round(w * DIALOG_WIDTH_RATIO)),
        height: Math.max(560, Math.min(h - 200, 1000))
      };
    }

    let sizeSaved = false;
    function rememberDialogSize(size) {
      if (sizeSaved) return;
      const openedW = Number(document.body.dataset.openedWidth) || 0;
      const openedH = Number(document.body.dataset.openedHeight) || 0;
      if (Math.abs(openedW - size.width) < 20 && Math.abs(openedH - size.height) < 20) return;
      sizeSaved = true;
      try {
        google.script.run.withFailureHandler(() => {}).saveCredentialDialogSize(size.width, size.height);
      } catch (_) {}
    }

    function fitDialog(attempt) {
      attempt = attempt || 0;
      const size = targetDialogSize();
      rememberDialogSize(size);
      try {
        google.script.host.setWidth(size.width);
        google.script.host.setHeight(size.height);
      } catch (_) {}
      if (attempt >= 6) return;
      setTimeout(() => {
        if (window.innerWidth < size.width - 80) fitDialog(attempt + 1);
      }, 250 + attempt * 250);
    }

    if (document.readyState === 'complete') fitDialog();
    else window.addEventListener('load', () => fitDialog());

    /* ---------- 読み込み ---------- */

    let loadingTicker = null;

    function startLoadingTicker() {
      stopLoadingTicker();
      const spinner = document.querySelector('.spinner');
      const began = Date.now();
      let angle = 0;
      loadingTicker = setInterval(() => {
        angle = (angle + 30) % 360;
        spinner.style.transform = 'rotate(' + angle + 'deg)';
        const seconds = Math.floor((Date.now() - began) / 1000);
        $('loadingTime').textContent = seconds >= 2 ? seconds + '秒経過' : '';
        if (seconds === 6) $('loadingText').textContent = '記録が多いため時間がかかっています。そのままお待ちください…';
      }, 70);
    }

    function stopLoadingTicker() {
      if (loadingTicker) clearInterval(loadingTicker);
      loadingTicker = null;
    }

    function showLoadError(error) {
      stopLoadingTicker();
      $('loadingTime').textContent = '';
      $('loading').classList.add('error');
      $('loadingText').textContent = '読み込めませんでした：' + (error && error.message || error);
      $('reload').hidden = false;
    }

    function load() {
      $('loading').classList.remove('error');
      $('loading').hidden = false;
      $('loadingText').textContent = '変更履歴を読み込んでいます…';
      $('reload').hidden = true;
      startLoadingTicker();
      google.script.run
        .withSuccessHandler(start)
        .withFailureHandler(showLoadError)
        .getChangeHistoryData(context.sheetName, context.row);
    }
    $('reload').addEventListener('click', load);

    function start(result) {
      stopLoadingTicker();
      $('loading').hidden = true;
      data = result;
      $('customer').textContent = data.customer;
      const focus = document.body.dataset.focusEvent;
      if (focus) openSnapshots.add(focus);   // サイドバーで選んだ変更は全項目も開いておく
      buildFilter();
      render();
      if (focus) {
        const node = document.querySelector('[data-event="' + CSS.escape(focus) + '"]');
        if (node) node.scrollIntoView({block: 'center'});
      }
    }

    load();
  </script>
</body>
</html>
