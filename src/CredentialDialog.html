<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1b1b1c;
      --body: #3c4642;
      --muted: #5a6660;
      --faint: #8a968a;
      --meta: #9AA59C;
      --line: #EFF2EF;
      --rail: #E2E7E2;
      --border: #DDE2DD;
      --border-hover: #C9D1C9;
      --soft: #F4F6F4;
      --comment: #F6F8F7;
      --panel: #FAFBFA;
      --teal: #36A191;
      --teal-hover: #2E8E80;
      --teal-text: #297A6E;
      --teal-soft: #E9F4F1;
      --cred: #1F6E5E;
      --cred-text: #1F5E55;
      --cred-soft: #EAF5F2;
      --off: #8B6FD6;
      --off-text: #6B4FB8;
      --off-soft: #F2EEFB;
      --danger: #B42318;
      --danger-border: #F1D3D0;
      --danger-soft: #FCEDEC;
      --mono: 'Azeret Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic UI', Meiryo, sans-serif;
      color: var(--ink); background: #ffffff; -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; }
    svg { flex: none; }

    .modal { display: flex; flex-direction: column; height: 100%; }

    /* ---------- 見出し ---------- */
    .m-head {
      display: flex; align-items: flex-start; gap: 16px;
      padding: 16px 24px 20px 32px; border-bottom: 1px solid var(--line);
    }
    .m-title { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
    .eyebrow { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
    .title-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .title-row h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .01em; }
    .chip { font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 2px 8px; background: var(--soft); border-radius: 6px; }
    .chip .warn { color: var(--danger); }
    .m-actions { display: flex; align-items: center; gap: 14px; flex: none; padding-top: 6px; }
    .status { font-size: 11.5px; color: var(--muted); max-width: 420px; }
    .status.ok { color: var(--teal-text); }
    .status.error { color: var(--danger); }
    .sync { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--faint); white-space: nowrap; }
    .sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }
    .sync.busy { color: var(--muted); }
    .sync.busy::before { animation: pulse 1s ease-in-out infinite; }
    .sync.error { color: var(--danger); }
    .sync.error::before { background: var(--danger); }
    @keyframes pulse { 50% { opacity: .25; } }

    .btn-primary {
      height: 34px; padding: 0 14px 0 12px; border: none; border-radius: 8px;
      background: var(--teal); color: #ffffff; font-size: 12.5px; font-weight: 600;
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .btn-primary:hover { background: var(--teal-hover); }
    .btn-primary:disabled { opacity: .5; cursor: default; }
    .btn-primary:focus-visible, .btn:focus-visible, .row-btn:focus-visible, .text-btn:focus-visible,
    .kind-card:focus-visible, .seg button:focus-visible, .icon-btn:focus-visible {
      outline: none; box-shadow: 0 0 0 3px rgba(54, 161, 145, .25);
    }

    /* ---------- 一覧 ---------- */
    .m-body { position: relative; flex: 1; min-height: 0; display: flex; }
    .list { flex: 1; min-width: 0; overflow: auto; padding: 4px 24px 16px 32px; }

    .group { display: flex; flex-direction: column; gap: 6px; padding: 14px 0 10px; border-bottom: 1px solid var(--line); }
    .entry {
      display: grid; grid-template-columns: 128px 20px minmax(0, 1fr) auto; column-gap: 16px;
      padding: 6px 8px; margin-left: -8px; border-radius: 10px;
    }
    .entry:hover { background: var(--panel); }
    .entry.editing { background: var(--cred-soft); }
    .entry.saving { opacity: .55; }
    .entry.failed { background: var(--danger-soft); }

    .dates {
      display: grid; grid-template-columns: auto auto; justify-content: end; align-content: start;
      align-items: baseline; column-gap: 6px; row-gap: 4px; padding-top: 6px; white-space: nowrap;
    }
    .d-label { font-size: 11px; color: var(--muted); }
    .d-val { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--ink); text-align: right; }
    .d-val.plan { color: var(--faint); }
    .d-val.overdue { color: var(--danger); }
    .d-tag { grid-column: 1 / -1; justify-self: end; font-size: 10.5px; font-weight: 600; color: var(--danger); }
    .done-btn {
      grid-column: 1 / -1; justify-self: end; margin-top: 2px; height: 24px; padding: 0 8px;
      border: 1px solid #BFE0D8; border-radius: 6px; background: #ffffff; color: var(--teal-text);
      font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 4px;
    }
    .done-btn:hover { background: var(--teal-soft); }

    .rail { display: flex; flex-direction: column; align-items: center; align-self: stretch; }
    .dot { flex: none; margin-top: 9px; width: 12px; height: 12px; border-radius: 50%; }
    .dot.cred { background: var(--cred); }
    .dot.off { background: #ffffff; border: 3px solid var(--off); }
    .dot.other { background: #ffffff; border: 3px solid #B5BEB7; }
    .rail-line { flex: 1; width: 1.5px; margin-top: 6px; margin-bottom: -18px; min-height: 0; background: var(--rail); }

    .content { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding-top: 2px; }
    .line1 { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 28px; }
    .kind { width: 88px; flex: none; font-size: 11px; font-weight: 700; letter-spacing: .04em; }
    .kind.cred { color: var(--cred-text); }
    .kind.off { color: var(--off-text); }
    .kind.other { color: var(--muted); }
    .name { font-size: 14.5px; font-weight: 700; color: var(--ink); overflow-wrap: anywhere; }
    .line2 { display: flex; align-items: center; gap: 8px; padding-left: 100px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
    .person { font-weight: 600; color: var(--ink); }
    .role { color: var(--faint); }
    .note-line { padding-left: 100px; font-size: 11.5px; color: var(--faint); }
    .owner-line { display: flex; align-items: center; gap: 8px; padding-left: 100px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
    .owner-tag { font-size: 10.5px; font-weight: 600; color: var(--faint); padding: 1px 6px; border: 1px solid var(--rail); border-radius: 5px; }
    .owner-name { font-weight: 600; color: var(--body); }
    .owner-dept { color: var(--faint); }

    .comment {
      margin-left: 100px; display: flex; flex-direction: column; gap: 6px;
      padding: 10px 14px; background: var(--comment); border-radius: 8px; max-width: 560px;
    }
    .c-text { margin: 0; font-size: 12.5px; line-height: 1.75; color: var(--body); white-space: pre-wrap; overflow-wrap: anywhere; }
    .c-text.clamp { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .c-toggle {
      align-self: flex-start; padding: 0; border: none; background: none;
      font-size: 11.5px; font-weight: 600; color: var(--teal-text); display: flex; align-items: center; gap: 4px;
    }
    .c-toggle:hover { text-decoration: underline; }
    .c-toggle svg { transition: transform .15s; }
    .c-toggle.open svg { transform: rotate(180deg); }

    .side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; padding-top: 2px; }
    .side-btns { display: flex; gap: 6px; }
    .row-btn {
      height: 30px; padding: 0 12px 0 10px; border: 1px solid var(--border); border-radius: 7px;
      background: #ffffff; color: var(--ink); font-size: 12px; font-weight: 600;
      display: flex; align-items: center; gap: 5px; white-space: nowrap;
    }
    .row-btn:hover { background: var(--soft); border-color: var(--border-hover); }
    .row-btn.danger { border-color: var(--danger-border); color: var(--danger); }
    .row-btn.danger:hover { background: var(--danger-soft); border-color: #E8B4AE; }
    .row-btn.confirm { background: var(--danger); border-color: var(--danger); color: #ffffff; }
    .row-btn.confirm:hover { background: #9A1D14; }
    .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 10.5px; line-height: 1.4; color: var(--meta); white-space: nowrap; }
    .meta .mono { font-family: var(--mono); }

    .group-foot { display: grid; grid-template-columns: 128px 20px minmax(0, 1fr); column-gap: 16px; }
    .text-btn {
      justify-self: start; height: 28px; padding: 0 10px; margin-left: -10px; border: none; border-radius: 7px;
      background: transparent; font-size: 12px; font-weight: 600; color: var(--teal-text);
      display: flex; align-items: center; gap: 6px;
    }
    .text-btn:hover { background: var(--teal-soft); }

    .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .empty strong { color: var(--ink); font-size: 15px; }
    .empty .btn-primary { margin-top: 8px; }

    /* ---------- 追加・編集パネル ---------- */
    .backdrop { position: absolute; inset: 0; background: rgba(255, 255, 255, .55); z-index: 5; }
    .drawer {
      position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 100%); z-index: 6;
      border-left: 1px solid #E6E9E6; background: var(--panel);
      box-shadow: -16px 0 32px -20px rgba(0, 20, 15, .28);
      display: flex; flex-direction: column; overflow-y: auto;
      animation: drawer-in .18s ease-out;
    }
    @keyframes drawer-in { from { transform: translateX(24px); opacity: 0; } }
    .dr-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 16px 24px; }
    .dr-titles { display: flex; flex-direction: column; gap: 2px; }
    .dr-title { font-size: 15px; font-weight: 700; }
    .dr-sub { font-size: 11.5px; color: var(--faint); }
    .icon-btn {
      width: 30px; height: 30px; border: none; border-radius: 7px; background: transparent; color: var(--muted);
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { background: #EEF2EF; color: var(--ink); }
    .dr-body { display: flex; flex-direction: column; gap: 20px; padding: 4px 24px 24px; }
    .fg { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .fl { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--body); }
    .fl .note { font-weight: 500; color: var(--faint); }
    .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    .kind-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .kind-card {
      display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 8px;
      border: 1px solid var(--border); background: #ffffff; font-size: 12.5px; font-weight: 600; color: var(--muted);
    }
    .kind-card .kdot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .kind-card.k0 .kdot { background: var(--cred); }
    .kind-card.k1 .kdot { background: #ffffff; border: 2.5px solid var(--off); }
    .kind-card.kx .kdot { background: #ffffff; border: 2.5px solid #B5BEB7; }
    .kind-card.k0.on { border-color: var(--teal); background: var(--cred-soft); color: var(--cred-text); }
    .kind-card.k1.on { border-color: var(--off); background: var(--off-soft); color: #5A3FA8; }
    .kind-card.kx.on { border-color: #9AA59C; background: var(--soft); color: var(--ink); }
    .seg { display: flex; padding: 3px; background: #EEF2EF; border-radius: 8px; gap: 2px; }
    .seg button {
      flex: 1; height: 30px; border: none; border-radius: 6px; background: transparent;
      color: var(--muted); font-size: 12.5px; font-weight: 600;
    }
    .seg button.on { background: #ffffff; box-shadow: 0 1px 2px rgba(0, 39, 117, .12); color: var(--ink); }
    .inp {
      height: 38px; width: 100%; min-width: 0; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px;
      background: #ffffff; font-size: 13px; color: var(--ink); outline: none;
    }
    select.inp { padding: 0 10px; }
    .inp.mono { font-family: var(--mono); font-size: 12.5px; padding: 0 10px; }
    textarea.inp { height: auto; padding: 10px 12px; line-height: 1.7; resize: vertical; }
    .inp:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(54, 161, 145, .16); }
    .inp::placeholder { color: #A8B1AA; }
    .fg.disabled { opacity: .45; }
    .divider { height: 1px; background: #E8ECE8; }
    .section-cap { margin-bottom: -10px; font-size: 11px; font-weight: 600; color: var(--faint); letter-spacing: .04em; }
    .dr-foot {
      margin-top: auto; position: sticky; bottom: 0; display: flex; justify-content: flex-end; align-items: center; gap: 8px;
      padding: 14px 24px; border-top: 1px solid var(--line); background: #ffffff;
    }
    .kbd { margin-right: auto; font-size: 11px; color: var(--meta); }
    .btn {
      height: 36px; padding: 0 16px; border: 1px solid var(--border); border-radius: 8px; background: #ffffff;
      font-size: 12.5px; font-weight: 600; color: var(--ink);
    }
    .btn:hover { background: var(--soft); }
    .dr-foot .btn-primary { height: 36px; padding: 0 20px; }

    /* ---------- 読み込み中 ---------- */
    .loading {
      position: fixed; inset: 0; z-index: 20; background: rgba(255, 255, 255, .96);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      color: var(--muted); font-size: 13px;
    }
    .loading p { margin: 0; }
    .loading small { color: var(--meta); font-size: 12px; min-height: 1.2em; }
    .spinner { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--rail); border-top-color: var(--teal); }
    .loading.error .spinner { display: none; }
    .loading.error p { color: var(--danger); }

    @media (prefers-reduced-motion: reduce) {
      *:not(.spinner) { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body data-sheet="<?= sheetName ?>" data-row="<?= row ?>" data-customer="<?= customer ?>" data-initial="<?= initial ?>"
      data-opened-width="<?= openedWidth ?>" data-opened-height="<?= openedHeight ?>"
      data-focus="<?= focusId ?>">
  <div class="loading" id="loading" role="status" aria-live="polite">
    <div class="spinner"></div>
    <p id="loadingText">履歴を読み込んでいます…</p>
    <small id="loadingTime"></small>
    <button type="button" class="btn" id="reload" hidden>もう一度読み込む</button>
  </div>

  <div class="modal">
    <header class="m-head">
      <div class="m-title">
        <span class="eyebrow">クレデンシャル・オファリング履歴</span>
        <div class="title-row">
          <h1 id="customer"></h1>
          <span class="chip" id="count"></span>
          <span class="chip" id="planChip" hidden></span>
        </div>
      </div>
      <div class="m-actions">
        <span class="status" id="status" role="status"></span>
        <span class="sync" id="sync" role="status">すべて保存済み</span>
        <button type="button" class="btn-primary" id="openAdd" disabled>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 1.5v9M1.5 6h9"/></svg>履歴を追加
        </button>
      </div>
    </header>

    <div class="m-body">
      <div class="list" id="list"></div>
      <div class="empty" id="empty" hidden>
        <strong>まだ履歴はありません</strong>
        <span>この得意先へのクレデンシャル・オファリングを登録できます。</span>
        <button type="button" class="btn-primary" id="openAddEmpty">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 1.5v9M1.5 6h9"/></svg>履歴を追加
        </button>
      </div>

      <div class="backdrop" id="backdrop" hidden></div>
      <aside class="drawer" id="drawer" hidden aria-labelledby="formTitle">
        <div class="dr-head">
          <div class="dr-titles">
            <span class="dr-title" id="formTitle">履歴を追加</span>
            <span class="dr-sub" id="formSub"></span>
          </div>
          <button type="button" class="icon-btn" id="closePanel" title="閉じる" aria-label="入力欄を閉じる">
            <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 2.5l9 9M11.5 2.5l-9 9"/></svg>
          </button>
        </div>

        <div class="dr-body">
          <div class="fg">
            <span class="fl" id="kindLabel">種別</span>
            <div class="kind-cards" id="kindCards" role="radiogroup" aria-labelledby="kindLabel"></div>
          </div>

          <label class="fg" id="linkField" hidden>
            <span class="fl">紐づけるクレデンシャル</span>
            <select class="inp" id="f-link"></select>
          </label>

          <div class="fg">
            <span class="fl" id="modeLabel">区分</span>
            <div class="seg" id="modeSeg" role="radiogroup" aria-labelledby="modeLabel">
              <button type="button" data-mode="plan">予定</button>
              <button type="button" data-mode="done">実績</button>
            </div>
          </div>

          <div class="grid2">
            <label class="fg" id="planWrap">
              <span class="fl">予定日<span class="note" id="planNote"></span></span>
              <input type="date" class="inp mono" id="f-plan">
            </label>
            <label class="fg" id="doneWrap">
              <span class="fl">実施日<span class="note" id="doneNote"></span></span>
              <input type="date" class="inp mono" id="f-date">
            </label>
          </div>

          <div class="divider"></div>

          <label class="fg">
            <span class="fl">名称</span>
            <input class="inp" id="f-name" placeholder="例：営業本部長向け ブランド刷新のご提案" autocomplete="off">
          </label>

          <span class="section-cap">先方</span>
          <div class="grid2">
            <label class="fg">
              <span class="fl">氏名</span>
              <input class="inp" id="f-person" placeholder="例：山田 太郎" autocomplete="off">
            </label>
            <label class="fg">
              <span class="fl">役職<span class="note">任意</span></span>
              <input class="inp" id="f-title" placeholder="例：購買部 部長" autocomplete="off">
            </label>
          </div>

          <span class="section-cap">当社の担当者</span>
          <div class="grid2">
            <label class="fg">
              <span class="fl">担当者名</span>
              <input class="inp" id="f-owner" placeholder="例：佐藤 一郎" autocomplete="off">
            </label>
            <label class="fg">
              <span class="fl">担当部署<span class="note">任意</span></span>
              <input class="inp" id="f-ownerDept" placeholder="例：第一営業部" autocomplete="off">
            </label>
          </div>

          <label class="fg">
            <span class="fl">フリーコメント<span class="note">任意</span></span>
            <textarea class="inp" id="f-note" rows="5" placeholder="提案の背景や相手の反応など"></textarea>
          </label>
        </div>

        <div class="dr-foot">
          <span class="kbd">Ctrl + Enter</span>
          <button type="button" class="btn" id="cancelEdit">キャンセル</button>
          <button type="button" class="btn-primary" id="save">追加する</button>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const context = {sheetName: document.body.dataset.sheet, row: Number(document.body.dataset.row)};
    $('customer').textContent = document.body.dataset.customer || '';

    let data = null;
    let L = null;                 // 紐づけの設定
    let entries = [];
    let editingId = null;
    let linkedParentId = null;
    let confirmDeleteId = null;
    let currentKind = '';
    let currentMode = 'done';     // 'plan'（予定）/ 'done'（実績）
    let pending = 0;
    let statusTimer = null;
    let chain = Promise.resolve();
    const expandedComments = new Set();

    const ICON = {
      plus: '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 1.5v9M1.5 6h9"/></svg>',
      edit: '<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M9.5 2 12 4.5 5 11.5H2.5V9z"/></svg>',
      trash: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 4h9M5.5 4V2.5h3V4M3.5 4l.6 7.5h5.8l.6-7.5"/></svg>',
      chevron: '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 3.5 5 6.5 8 3.5"/></svg>',
      check: '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5 4.8 9 10 3"/></svg>'
    };

    /** 要素を作る小さな補助。text は文字列として入れる（HTML として解釈しない）。 */
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }
    function button(className, label, icon, onClick) {
      const b = el('button', className);
      b.type = 'button';
      if (icon) b.insertAdjacentHTML('beforeend', ICON[icon]);   // ICON は固定の文字列だけ
      b.appendChild(document.createTextNode(label));
      b.addEventListener('click', onClick);
      return b;
    }

    /* ---------- サーバー呼び出し（順番に1件ずつ送る） ---------- */

    function call(method, payload) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)[method](Object.assign({
            sheetName: data.sheetName,
            row: data.row,
            customer: data.customer,
            customerColumn: data.customerColumn
          }, payload));
      });
    }

    function enqueue(task) {
      pending++;
      renderSync();
      const run = chain.then(task);
      chain = run.catch(() => {});
      return run.finally(() => { pending--; renderSync(); });
    }

    /* ---------- 状態表示 ---------- */

    function status(text, kind) {
      clearTimeout(statusTimer);
      $('status').textContent = text || '';
      $('status').className = 'status' + (kind ? ' ' + kind : '');
      if (text && kind !== 'error') statusTimer = setTimeout(() => status(''), 4000);
    }

    function renderSync() {
      const failed = entries.some(e => e.state === 'failed');
      const node = $('sync');
      if (pending) { node.textContent = '保存中…（閉じずにお待ちください）'; node.className = 'sync busy'; }
      else if (failed) { node.textContent = '保存できなかった履歴があります'; node.className = 'sync error'; }
      else { node.textContent = 'すべて保存済み'; node.className = 'sync'; }
    }

    /* ---------- 種別・紐づけ・予定と実績 ---------- */

    const fieldByKey = key => data.fields.find(f => f.key === key);
    const kindOf = entry => entry.values[L.kindKey] || '';
    const isParent = entry => kindOf(entry) === L.parentKind;
    const isChild = entry => kindOf(entry) === L.childKind;
    const findEntry = id => entries.find(e => e.id && e.id === id);
    const liveParent = id => {
      const parent = id && findEntry(id);
      return parent && parent.state !== 'deleting' && isParent(parent) ? parent : null;
    };
    const childrenOf = id => entries.filter(e => e.linkId === id && e.state !== 'deleting' && isChild(e));

    /** 種別ごとの見た目：0 = クレデンシャル、1 = オファリング、それ以外 = 旧い種別 */
    function kindClass(kind) {
      const index = fieldByKey(L.kindKey).options.indexOf(kind);
      return index === 0 ? 'cred' : index === 1 ? 'off' : 'other';
    }

    function parentLabel(entry) {
      return L.labelKeys
        .map(key => key.split('|').map(k => entry.values[k]).find(Boolean))
        .filter(Boolean).join(' / ');
    }

    const todaySlash = () => data.today.replace(/-/g, '/');

    /** 'done'（実績）/ 'plan'（予定）/ 'overdue'（予定日を過ぎた予定） */
    function scheduleState(entry) {
      const S = data.schedule;
      if (entry.values[S.doneKey]) return 'done';
      const plan = entry.values[S.planKey];
      return plan && plan < todaySlash() ? 'overdue' : 'plan';
    }

    /** 予定を先に（予定日の早い順）、実績は新しい順。 */
    function compareEntries(a, b) {
      const S = data.schedule;
      const ad = a.values[S.doneKey] || '', bd = b.values[S.doneKey] || '';
      if (!ad !== !bd) return ad ? 1 : -1;
      if (!ad) return (a.values[S.planKey] || '9999').localeCompare(b.values[S.planKey] || '9999');
      return bd.localeCompare(ad);
    }

    /** クレデンシャルと、それに紐づくオファリングを1つのまとまりにする。 */
    function groupsOf(visible) {
      const children = new Map();
      const top = [];
      visible.forEach(entry => {
        const parent = isChild(entry) ? liveParent(entry.linkId) : null;
        if (parent) {
          if (!children.has(parent.id)) children.set(parent.id, []);
          children.get(parent.id).push(entry);
        } else {
          top.push(entry);
        }
      });
      return top.sort(compareEntries).map(head =>
        [head].concat((head.id ? children.get(head.id) || [] : []).sort(compareEntries)));
    }

    /* ---------- 一覧 ---------- */

    function render() {
      const visible = entries.filter(e => e.state !== 'deleting');
      $('count').textContent = visible.length + '件';

      const plans = visible.filter(e => scheduleState(e) !== 'done');
      const overdue = plans.filter(e => scheduleState(e) === 'overdue').length;
      const chip = $('planChip');
      chip.hidden = !plans.length;
      chip.textContent = '予定 ' + plans.length + '件';
      if (overdue) chip.appendChild(el('span', 'warn', '（期限超過 ' + overdue + '）'));

      $('list').hidden = !visible.length;
      $('empty').hidden = visible.length > 0;
      const list = $('list');
      list.textContent = '';
      groupsOf(visible).forEach(group => list.appendChild(renderGroup(group)));

      if (!editingId) refreshLinkOptions();
      renderSync();
      requestAnimationFrame(updateCommentToggles);
    }

    function renderGroup(group) {
      const box = el('div', 'group');
      group.forEach((entry, index) => box.appendChild(renderEntry(entry, index === group.length - 1)));

      const head = group[0];
      if (isParent(head) && head.id && !head.state) {
        const foot = el('div', 'group-foot');
        foot.append(el('span'), el('span'),
          button('text-btn', L.childKind + 'を追加', 'plus', () => startLinked(head)));
        box.appendChild(foot);
      }
      return box;
    }

    function renderEntry(entry, isLast) {
      const S = data.schedule;
      const classes = ['entry'];
      if (entry.state) classes.push(entry.state);
      else if (editingId && editingId === entry.id) classes.push('editing');
      const row = el('div', classes.join(' '));
      if (entry.source) row.title = '登録元: ' + entry.source;
      if (entry.id) row.dataset.id = entry.id;

      // 日付（実績・予定）
      const state = scheduleState(entry);
      const dates = el('div', 'dates');
      dates.append(
        el('span', 'd-label', '実績'),
        el('span', 'd-val', entry.values[S.doneKey] || '—'),
        el('span', 'd-label', '予定'),
        el('span', 'd-val plan' + (state === 'overdue' ? ' overdue' : ''), entry.values[S.planKey] || '—')
      );
      if (state === 'overdue') dates.appendChild(el('span', 'd-tag', '期限超過'));
      if (state !== 'done' && entry.id && !entry.state) {
        const done = button('done-btn', '実施済みにする', 'check', () => markDone(entry));
        done.title = '実施日に今日の日付を入れて実績にします';
        dates.appendChild(done);
      }

      // 接続（● クレデンシャル／○ オファリング、同じまとまりの次の行へ線をつなぐ）
      const kind = kindOf(entry);
      const rail = el('div', 'rail');
      rail.appendChild(el('span', 'dot ' + kindClass(kind)));
      if (!isLast) rail.appendChild(el('span', 'rail-line'));

      // 内容
      const content = el('div', 'content');
      const line1 = el('div', 'line1');
      line1.append(el('span', 'kind ' + kindClass(kind), kind), el('span', 'name', entry.values.name || ''));
      content.appendChild(line1);

      const person = entry.values.person || '', role = entry.values.title || '';
      if (person || role) {
        const line2 = el('div', 'line2');
        if (person) line2.appendChild(el('span', 'person', person));
        if (role) line2.appendChild(el('span', 'role', role));
        content.appendChild(line2);
      }
      const owner = entry.values.owner || '', ownerDept = entry.values.ownerDept || '';
      if (owner || ownerDept) {
        const line3 = el('div', 'owner-line');
        line3.appendChild(el('span', 'owner-tag', '担当'));
        if (owner) line3.appendChild(el('span', 'owner-name', owner));
        if (ownerDept) line3.appendChild(el('span', 'owner-dept', ownerDept));
        content.appendChild(line3);
      }
      if (isChild(entry) && entry.linkId && !liveParent(entry.linkId)) {
        content.appendChild(el('div', 'note-line', '紐づけ先の' + L.parentKind + 'は削除されています'));
      }
      if (entry.values.note) content.appendChild(renderComment(entry, entry.values.note));

      // 操作と登録情報
      const side = el('div', 'side');
      const btns = el('div', 'side-btns');
      if (entry.state === 'failed') {
        btns.append(
          button('row-btn', '再試行', null, () => { entry.state = 'saving'; render(); sendCreate(entry); }),
          button('row-btn danger', '取り消す', null, () => { entries = entries.filter(e => e !== entry); render(); })
        );
      } else if (entry.state !== 'saving' && entry.id) {
        if (confirmDeleteId === entry.id) {
          btns.append(
            button('row-btn confirm', '削除する', 'trash', () => remove(entry)),
            button('row-btn', 'やめる', null, () => { confirmDeleteId = null; status(''); render(); })
          );
        } else {
          btns.append(
            button('row-btn', '編集', 'edit', () => startEdit(entry)),
            button('row-btn danger', '削除', 'trash', () => askDelete(entry))
          );
        }
      }
      side.appendChild(btns);

      const meta = el('span', 'meta');
      if (entry.state === 'saving') {
        meta.appendChild(el('span', '', '保存中…'));
      } else if (entry.state === 'failed') {
        meta.appendChild(el('span', '', '保存できませんでした'));
      } else {
        meta.appendChild(el('span', '', String(entry.editor || '').split('@')[0]));
        meta.appendChild(el('span', 'mono', '登録 ' + String(entry.at || '').slice(5)));
        if (entry.updatedAt) meta.appendChild(el('span', 'mono', '編集 ' + String(entry.updatedAt).slice(5)));
        meta.title = '登録: ' + entry.at + ' ' + entry.editor +
          (entry.updatedAt ? '\n最終編集: ' + entry.updatedAt + ' ' + entry.updatedBy : '');
      }
      side.appendChild(meta);

      row.append(dates, rail, content, side);
      return row;
    }

    /** フリーコメント。2行を超えるものは折りたたみ、「すべて表示」で開く。 */
    function renderComment(entry, text) {
      const key = entry.id || entry;
      const open = expandedComments.has(key);
      const box = el('div', 'comment');
      box.appendChild(el('p', 'c-text' + (open ? '' : ' clamp'), text));
      const toggle = button('c-toggle' + (open ? ' open' : ''), open ? '折りたたむ' : 'すべて表示', null, () => {
        if (open) expandedComments.delete(key); else expandedComments.add(key);
        render();
      });
      toggle.insertAdjacentHTML('beforeend', ICON.chevron);
      toggle.hidden = true;               // 実際に2行を超えるかは描画後に判定する
      toggle.dataset.open = open ? '1' : '';
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      box.appendChild(toggle);
      return box;
    }

    function updateCommentToggles() {
      document.querySelectorAll('.comment').forEach(box => {
        const text = box.querySelector('.c-text');
        const toggle = box.querySelector('.c-toggle');
        toggle.hidden = toggle.dataset.open !== '1' && !(text.scrollHeight > text.clientHeight + 1);
      });
    }
    window.addEventListener('resize', updateCommentToggles);

    /* ---------- 追加・編集パネル ---------- */

    function renderKindCards() {
      const field = fieldByKey(L.kindKey);
      const options = field.options.slice();
      if (currentKind && options.indexOf(currentKind) < 0) options.push(currentKind);   // 旧い種別
      const box = $('kindCards');
      box.textContent = '';
      options.forEach((option, index) => {
        const legacy = field.options.indexOf(option) < 0;
        const card = el('button', 'kind-card ' + (legacy ? 'kx' : 'k' + Math.min(index, 1)) +
          (currentKind === option ? ' on' : ''));
        card.type = 'button';
        card.setAttribute('role', 'radio');
        card.setAttribute('aria-checked', currentKind === option ? 'true' : 'false');
        card.append(el('span', 'kdot'), document.createTextNode(option + (legacy ? '（旧）' : '')));
        card.addEventListener('click', () => setKind(option));
        box.appendChild(card);
      });
    }

    function setKind(kind) {
      currentKind = kind || '';
      renderKindCards();
      const show = currentKind === L.childKind;
      $('linkField').hidden = !show;
      if (!show) $('f-link').value = '';
    }

    /** 予定：実施日は使わない（空にして無効化）／実績：実施日を使う（fill なら今日を入れる）。 */
    function setMode(mode, fill) {
      currentMode = mode;
      document.querySelectorAll('#modeSeg button').forEach(b => {
        const on = b.dataset.mode === mode;
        b.classList.toggle('on', on);
        b.setAttribute('aria-checked', on ? 'true' : 'false');
      });
      const done = $('f-' + data.schedule.doneKey);
      if (mode === 'plan') {
        done.value = '';
        done.disabled = true;
        $('doneWrap').classList.add('disabled');
        $('doneNote').textContent = '予定のため不要';
        $('planNote').textContent = '';
      } else {
        done.disabled = false;
        $('doneWrap').classList.remove('disabled');
        $('doneNote').textContent = '';
        $('planNote').textContent = '任意';
        if (fill && !done.value) done.value = data.today;
      }
    }

    /** 紐づけ先の選択肢を最新の一覧で作り直す。 */
    function refreshLinkOptions() {
      const select = $('f-link');
      const keep = select.value;
      select.textContent = '';
      entries
        .filter(e => e.id && e.state !== 'deleting' && isParent(e))
        .sort(compareEntries)
        .forEach(e => select.add(new Option(parentLabel(e), e.id)));
      select.add(new Option('紐づけない', ''));
      select.value = [...select.options].some(o => o.value === keep) ? keep : '';
    }

    const inputOf = field => $('f-' + field.key);
    const toInputDate = value => /^\d{4}\/\d{2}\/\d{2}$/.test(value || '') ? value.replace(/\//g, '-') : '';

    function resetForm() {
      data.fields.forEach(field => {
        const input = field.key === L.kindKey ? null : inputOf(field);
        if (input) input.value = '';
      });
      $('f-' + data.schedule.doneKey).value = data.today;
      // 担当者は、この人が前回登録した履歴の担当者を初期値にする
      const mine = entries
        .filter(e => e.id && e.editor && e.editor === data.currentUser && e.values.owner)
        .sort((a, b) => String(b.at).localeCompare(String(a.at)))[0];
      if (mine) {
        $('f-owner').value = mine.values.owner || '';
        $('f-ownerDept').value = mine.values.ownerDept || '';
      }
      setKind('');
      setMode('done', false);
      refreshLinkOptions();
      $('f-link').value = '';
    }

    function collect() {
      const S = data.schedule;
      const values = {};
      data.fields.forEach(field => {
        let value = field.key === L.kindKey ? currentKind : String((inputOf(field) || {}).value || '').trim();
        if (field.type === 'date') value = value.replace(/-/g, '/');
        if (field.type !== 'textarea') value = value.replace(/\s*[\r\n\t]+\s*/g, ' ');
        values[field.key] = value;
      });
      if (currentMode === 'plan') values[S.doneKey] = '';

      const fail = (message, focus) => { if (focus) focus.focus(); throw new Error(message); };
      if (!values[L.kindKey]) fail('種別を選んでください。', $('kindCards').querySelector('button'));
      const dateKey = currentMode === 'plan' ? S.planKey : S.doneKey;
      if (!values[dateKey]) fail('「' + fieldByKey(dateKey).label + '」を入力してください。', $('f-' + dateKey));
      data.fields.forEach(field => {
        if (field.required && field.key !== L.kindKey && !values[field.key]) {
          fail('「' + field.label + '」を入力してください。', inputOf(field));
        }
      });
      const linkId = values[L.kindKey] === L.childKind ? $('f-link').value : '';
      return {values, linkId};
    }

    function openPanel(title, buttonLabel) {
      $('formTitle').textContent = title;
      $('formSub').textContent = data.customer;
      $('save').textContent = buttonLabel;
      $('drawer').hidden = false;
      $('backdrop').hidden = false;
    }

    function openAdd() {
      editingId = null;
      linkedParentId = null;
      confirmDeleteId = null;
      resetForm();
      openPanel('履歴を追加', '追加する');
      status('');
      render();
    }

    function startEdit(entry) {
      editingId = entry.id;
      linkedParentId = null;
      confirmDeleteId = null;
      resetForm();
      data.fields.forEach(field => {
        if (field.key === L.kindKey) return;
        const input = inputOf(field);
        if (input) input.value = field.type === 'date' ? toInputDate(entry.values[field.key]) : (entry.values[field.key] || '');
      });
      setKind(kindOf(entry));
      setMode(scheduleState(entry) === 'done' ? 'done' : 'plan', false);
      refreshLinkOptions();
      $('f-link').value = liveParent(entry.linkId) ? entry.linkId : '';
      openPanel('履歴を編集', '変更を保存');
      status('');
      render();
      $('f-name').focus();
    }

    /** クレデンシャルのまとまりから、紐づいたオファリングの入力を始める。 */
    function startLinked(parent) {
      editingId = null;
      linkedParentId = parent.id;
      confirmDeleteId = null;
      resetForm();
      setKind(L.childKind);
      L.copyKeys.forEach(key => { const input = $('f-' + key); if (input) input.value = parent.values[key] || ''; });
      refreshLinkOptions();
      $('f-link').value = parent.id;
      openPanel(L.childKind + 'を追加', '追加する');
      status('');
      render();
      $('f-name').focus();
    }

    /** 入力をやめてパネルを閉じる（追加・保存のあとも閉じる）。 */
    function stopEdit() {
      editingId = null;
      linkedParentId = null;
      $('drawer').hidden = true;
      $('backdrop').hidden = true;
      render();
    }

    /* ---------- 操作（画面を先に更新し、裏で保存する） ---------- */

    function submit() {
      if (!data || $('drawer').hidden) return;
      let input;
      try { input = collect(); } catch (error) { status(error.message, 'error'); return; }
      const {values, linkId} = input;

      if (editingId) {
        const entry = entries.find(e => e.id === editingId);
        stopEdit();
        if (!entry) return;
        const unchanged = data.fields.every(f => (entry.values[f.key] || '') === values[f.key]) &&
          (entry.linkId || '') === linkId;
        if (unchanged) { status('変更はありません。'); return; }
        applyUpdate(entry, values, linkId, '変更を保存しました。');
        return;
      }

      const entry = {id: null, values, linkId, state: 'saving', at: '', editor: ''};
      entries.unshift(entry);
      stopEdit();
      sendCreate(entry);
    }

    function applyUpdate(entry, values, linkId, okMessage) {
      const before = entry.values;
      const beforeLink = entry.linkId || '';
      entry.values = values;
      entry.linkId = linkId;
      entry.state = 'saving';
      render();
      enqueue(() => call('updateCredentialEntry',
        {id: entry.id, original: before, originalLinkId: beforeLink, values, linkId}))
        .then(result => {
          Object.assign(entry, result.entry);
          entry.state = null;
          status(result.message || okMessage, result.message ? '' : 'ok');
        })
        .catch(error => {
          entry.values = before;
          entry.linkId = beforeLink;
          entry.state = null;
          status(error.message, 'error');
        })
        .finally(render);
    }

    /** 予定を、今日の日付で実績にする。 */
    function markDone(entry) {
      if (editingId === entry.id) stopEdit();
      const values = Object.assign({}, entry.values, {[data.schedule.doneKey]: todaySlash()});
      applyUpdate(entry, values, entry.linkId || '', '実施済みにしました。');
    }

    function sendCreate(entry) {
      enqueue(() => call('saveCredentialEntry', {values: entry.values, linkId: entry.linkId || ''}))
        .then(result => {
          Object.assign(entry, result.entry);
          entry.state = null;
          status(result.message || '追加しました。', result.message ? '' : 'ok');
        })
        .catch(error => {
          entry.state = 'failed';
          status(error.message, 'error');
        })
        .finally(render);
    }

    function askDelete(entry) {
      confirmDeleteId = entry.id;
      const count = isParent(entry) ? childrenOf(entry.id).length : 0;
      status(count ? '紐づいている' + L.childKind + ' ' + count + '件は、紐づけなしで残ります。' : '');
      render();
    }

    function remove(entry) {
      confirmDeleteId = null;
      if (editingId === entry.id || linkedParentId === entry.id) stopEdit();
      entry.state = 'deleting';
      render();
      enqueue(() => call('deleteCredentialEntry',
        {id: entry.id, original: entry.values, originalLinkId: entry.linkId || ''}))
        .then(result => {
          entries = entries.filter(e => e !== entry);
          status(result.message || '削除しました。', result.message ? '' : 'ok');
        })
        .catch(error => {
          entry.state = null;
          status(error.message, 'error');
        })
        .finally(render);
    }

    $('save').addEventListener('click', submit);
    $('cancelEdit').addEventListener('click', stopEdit);
    $('closePanel').addEventListener('click', stopEdit);
    $('backdrop').addEventListener('click', stopEdit);
    $('openAdd').addEventListener('click', openAdd);
    $('openAddEmpty').addEventListener('click', openAdd);
    document.querySelectorAll('#modeSeg button').forEach(b =>
      b.addEventListener('click', () => setMode(b.dataset.mode, true)));
    document.addEventListener('keydown', event => {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter' && !$('drawer').hidden) {
        event.preventDefault();
        submit();
      }
    });

    /* ---------- モーダルの大きさ（ブラウザの窓幅の 95%） ---------- */

    const DIALOG_WIDTH_RATIO = 0.95;

    function targetDialogSize() {
      const w = window.outerWidth || screen.availWidth;
      const h = window.outerHeight || screen.availHeight;
      return {
        width: Math.max(720, Math.round(w * DIALOG_WIDTH_RATIO)),
        height: Math.max(560, Math.min(h - 200, 1000))
      };
    }

    /** 開いた大きさと95%の大きさが違えば、次回からその大きさで開けるよう保存する。 */
    let sizeSaved = false;
    function rememberDialogSize(size) {
      if (sizeSaved) return;
      const openedW = Number(document.body.dataset.openedWidth) || 0;
      const openedH = Number(document.body.dataset.openedHeight) || 0;
      if (Math.abs(openedW - size.width) < 20 && Math.abs(openedH - size.height) < 20) return;
      sizeSaved = true;
      try {
        google.script.run.withFailureHandler(() => {}).saveCredentialDialogSize(size.width, size.height);
      } catch (_) {}
    }

    /** 読み込み完了後に大きさを指定し、反映されたかを確かめて数回まで指定し直す。 */
    function fitDialog(attempt) {
      attempt = attempt || 0;
      const size = targetDialogSize();
      rememberDialogSize(size);
      try {
        google.script.host.setWidth(size.width);
        google.script.host.setHeight(size.height);
      } catch (_) {}
      if (attempt >= 6) return;
      setTimeout(() => {
        if (window.innerWidth < size.width - 80) fitDialog(attempt + 1);
      }, 250 + attempt * 250);
    }

    if (document.readyState === 'complete') fitDialog();
    else window.addEventListener('load', () => fitDialog());
    let lastOuterWidth = window.outerWidth;
    setInterval(() => {
      if (window.outerWidth && Math.abs(window.outerWidth - lastOuterWidth) > 20) {
        lastOuterWidth = window.outerWidth;
        fitDialog(6);
      }
    }, 1000);

    /* ---------- 読み込み ---------- */

    // くるくると経過秒数は JavaScript で動かす（OS の「動きを減らす」設定でも止まらない）
    let loadingTicker = null;

    function startLoadingTicker() {
      stopLoadingTicker();
      const spinner = document.querySelector('.spinner');
      const began = Date.now();
      let angle = 0;
      loadingTicker = setInterval(() => {
        angle = (angle + 30) % 360;
        spinner.style.transform = 'rotate(' + angle + 'deg)';
        const seconds = Math.floor((Date.now() - began) / 1000);
        $('loadingTime').textContent = seconds >= 2 ? seconds + '秒経過' : '';
        if (seconds === 6) $('loadingText').textContent = '読み込みに時間がかかっています。そのままお待ちください…';
      }, 70);
    }

    function stopLoadingTicker() {
      if (loadingTicker) clearInterval(loadingTicker);
      loadingTicker = null;
    }

    function showLoadError(error) {
      stopLoadingTicker();
      $('loadingTime').textContent = '';
      $('loading').classList.add('error');
      $('loadingText').textContent = '読み込めませんでした：' + (error && error.message || error);
      $('reload').hidden = false;
    }

    function load() {
      $('loading').classList.remove('error');
      $('loading').hidden = false;
      $('loadingText').textContent = '履歴を読み込んでいます…';
      $('reload').hidden = true;
      startLoadingTicker();
      google.script.run
        .withSuccessHandler(start)
        .withFailureHandler(showLoadError)
        .getCredentialDialogData(context.sheetName, context.row);
    }
    $('reload').addEventListener('click', load);

    function start(result) {
      stopLoadingTicker();
      $('loading').hidden = true;
      data = result;
      L = data.linking;
      entries = data.entries.map(e => Object.assign({state: null, linkId: ''}, e));
      $('customer').textContent = data.customer;
      data.fields.forEach(field => {
        const input = field.key === L.kindKey ? null : inputOf(field);
        if (input && field.maxLength) input.maxLength = field.maxLength;
      });
      resetForm();
      render();
      $('openAdd').disabled = false;

      // サイドバーで選んだ履歴があれば、その行へ移動して編集パネルを開く
      const focus = document.body.dataset.focus;
      const target = focus && entries.find(e => e.id === focus);
      if (target) {
        startEdit(target);
        const node = document.querySelector('[data-id="' + CSS.escape(focus) + '"]');
        if (node) node.scrollIntoView({block: 'center'});
      }
    }

    let initial = null;
    try { initial = document.body.dataset.initial ? JSON.parse(document.body.dataset.initial) : null; } catch (_) {}
    if (initial) start(initial); else load();
  </script>
</body>
</html>
