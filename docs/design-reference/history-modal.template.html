<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="9b3e1106-8189-4a88-9522-e7f525cd6634"></script>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style></style>
<style>
  body { margin:0; background:#5f6a66; font-family:'Inter','Noto Sans JP','Hiragino Sans',sans-serif; color:#1b1b1c; -webkit-font-smoothing:antialiased; }
  a { color:#297A6E; text-decoration:none; }
  a:hover { color:#1F5E55; text-decoration:underline; }
</style>
</helmet>
<div style="min-height:100vh; box-sizing:border-box; padding:40px 24px; display:flex; justify-content:center; align-items:flex-start; background:rgba(18,28,25,.55)">
  <div style="width:100%; max-width:{{ modalMax }}; background:#ffffff; border-radius:16px; box-shadow:0 24px 64px -16px rgba(0,20,15,.45), 0 2px 6px rgba(0,20,15,.08); display:flex; flex-direction:column; overflow:hidden">

    <div style="display:flex; align-items:flex-start; gap:16px; padding:24px 24px 20px 32px; border-bottom:1px solid #EFF2EF">
      <div style="display:flex; flex-direction:column; gap:6px; flex:1; min-width:0">
        <span style="font-size:12px; font-weight:600; color:#5a6660; letter-spacing:.04em">クレデンシャル・オファリング履歴</span>
        <div style="display:flex; align-items:baseline; gap:10px; flex-wrap:wrap">
          <h2 style="margin:0; font-size:22px; font-weight:700; letter-spacing:.01em">株式会社サンプル商事</h2>
          <span style="font-family:'Azeret Mono',monospace; font-size:11px; color:#5a6660; padding:2px 8px; background:#F4F6F4; border-radius:6px">{{ countLabel }}</span>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:14px; flex:none; padding-top:6px">
        <span style="display:flex; align-items:center; gap:6px; font-size:11.5px; color:#8a968a"><span style="width:6px; height:6px; border-radius:50%; background:#36A191"></span>すべて保存済み</span>
        <button sc-camel-on-click="{{ openAdd }}" style="height:34px; padding:0 14px 0 12px; border:none; border-radius:8px; background:#36A191; color:#ffffff; font-family:inherit; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px; cursor:pointer" style-hover="background:#2E8E80"><svg width="12" height="12" sc-camel-view-box="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 1.5v9M1.5 6h9"></path></svg>履歴を追加</button>
        <button title="閉じる" style="width:34px; height:34px; border:none; border-radius:8px; background:transparent; color:#5a6660; display:flex; align-items:center; justify-content:center; cursor:pointer" style-hover="background:#F4F6F4; color:#1b1b1c"><svg width="14" height="14" sc-camel-view-box="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 2.5l9 9M11.5 2.5l-9 9"></path></svg></button>
      </div>
    </div>

    <div style="position:relative; display:flex; align-items:stretch; min-height:{{ bodyMin }}">
    <div style="display:flex; flex-direction:column; padding:4px 24px 16px 32px; flex:1; min-width:0">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
        <div style="display:flex; flex-direction:column; gap:6px; padding:14px 0 10px; border-bottom:1px solid #EFF2EF">
          <sc-for list="{{ g.entries }}" as="e" hint-placeholder-count="1">
            <div style="display:grid; grid-template-columns:128px 20px minmax(0,1fr) auto; column-gap:16px; padding:6px 8px 6px 0; margin-left:-8px; padding-left:8px; border-radius:10px" style-hover="background:#FAFBFA">
              <div style="display:grid; grid-template-columns:auto auto; justify-content:end; align-content:start; align-items:baseline; column-gap:6px; row-gap:4px; padding-top:6px; white-space:nowrap">
                <span style="font-size:11px; color:#5a6660">実績</span>
                <span style="font-family:'Azeret Mono',monospace; font-size:12px; font-weight:500; color:#1b1b1c; text-align:right">{{ e.done }}</span>
                <span style="font-size:11px; color:#5a6660">予定</span>
                <span style="font-family:'Azeret Mono',monospace; font-size:12px; font-weight:500; color:#8a968a; text-align:right">{{ e.plan }}</span>
              </div>
              <div style="display:flex; flex-direction:column; align-items:center; align-self:stretch">
                <span style="flex:none; margin-top:9px; width:12px; height:12px; border-radius:50%; box-sizing:border-box; border:{{ e.dotBorder }}; background:{{ e.dotBg }}"></span>
                <span style="flex:1; width:1.5px; margin-top:6px; margin-bottom:-18px; min-height:0; background:#E2E7E2; display:{{ e.rail }}"></span>
              </div>
              <div style="display:flex; flex-direction:column; gap:6px; min-width:0; padding-top:2px">
                <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-height:28px">
                  <span style="width:88px; flex:none; font-size:11px; font-weight:700; letter-spacing:.04em; color:{{ e.kindColor }}">{{ e.kind }}</span>
                  <span style="font-size:14.5px; font-weight:700; color:#1b1b1c">{{ e.name }}</span>
                </div>
                <div style="display:flex; align-items:center; gap:8px; padding-left:100px; font-size:12px; color:#5a6660; flex-wrap:wrap">
                  <span style="font-weight:600; color:#1b1b1c">{{ e.person }}</span>
                  <span style="color:#8a968a">{{ e.role }}</span>
                </div>
                <sc-if value="{{ e.hasComment }}" hint-placeholder-val="{{ false }}">
                  <div style="margin-left:100px; display:flex; flex-direction:column; gap:6px; padding:10px 14px; background:#F6F8F7; border-radius:8px; max-width:560px">
                    <p style="margin:0; font-size:12.5px; line-height:1.75; color:#3c4642; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:{{ e.clamp }}; text-wrap:pretty">{{ e.comment }}</p>
                    <sc-if value="{{ e.isLong }}" hint-placeholder-val="{{ false }}">
                      <button sc-camel-on-click="{{ e.toggle }}" style="align-self:flex-start; padding:0; border:none; background:none; font-family:inherit; font-size:11.5px; font-weight:600; color:#297A6E; cursor:pointer; display:flex; align-items:center; gap:4px">{{ e.toggleLabel }}<svg width="10" height="10" sc-camel-view-box="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="transform:{{ e.chevron }}"><path d="M2 3.5 5 6.5 8 3.5"></path></svg></button>
                    </sc-if>
                  </div>
                </sc-if>
              </div>
              <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px; padding-top:2px">
                <div style="display:flex; gap:6px">
                <button style="height:30px; padding:0 12px 0 10px; border:1px solid #DDE2DD; border-radius:7px; background:#ffffff; color:#1b1b1c; font-family:inherit; font-size:12px; font-weight:600; display:flex; align-items:center; gap:5px; cursor:pointer" style-hover="background:#F4F6F4; border-color:#C9D1C9"><svg width="13" height="13" sc-camel-view-box="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M9.5 2 12 4.5 5 11.5H2.5V9z"></path></svg>編集</button>
                <button style="height:30px; padding:0 12px 0 10px; border:1px solid #F1D3D0; border-radius:7px; background:#ffffff; color:#B42318; font-family:inherit; font-size:12px; font-weight:600; display:flex; align-items:center; gap:5px; cursor:pointer" style-hover="background:#FCEDEC; border-color:#E8B4AE"><svg width="14" height="14" sc-camel-view-box="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 4h9M5.5 4V2.5h3V4M3.5 4l.6 7.5h5.8l.6-7.5"></path></svg>削除</button>
                </div>
                <span style="display:flex; flex-direction:column; align-items:flex-end; gap:2px; font-size:10.5px; line-height:1.4; color:#9AA59C; white-space:nowrap">
                  <span>{{ e.user }}</span>
                  <span style="font-family:'Azeret Mono',monospace">登録 {{ e.created }}</span>
                  <span style="font-family:'Azeret Mono',monospace">編集 {{ e.edited }}</span>
                </span>
              </div>
            </div>
          </sc-for>
          <div style="display:grid; grid-template-columns:128px 20px minmax(0,1fr); column-gap:16px">
            <span></span>
            <span></span>
            <button style="justify-self:start; height:28px; padding:0 10px; margin-left:-10px; border:none; border-radius:7px; background:transparent; font-family:inherit; font-size:12px; font-weight:600; color:#297A6E; display:flex; align-items:center; gap:6px; cursor:pointer" style-hover="background:#E9F4F1"><svg width="11" height="11" sc-camel-view-box="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 1.5v9M1.5 6h9"></path></svg>オファリングを追加</button>
          </div>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{ addOpen }}" hint-placeholder-val="{{ true }}">
      <div sc-camel-on-click="{{ closeAdd }}" style="position:absolute; inset:0; background:rgba(255,255,255,.55)"></div>
      <aside style="position:absolute; top:0; right:0; bottom:0; width:min(380px, 100%); box-sizing:border-box; border-left:1px solid #E6E9E6; background:#FAFBFA; box-shadow:-16px 0 32px -20px rgba(0,20,15,.28); display:flex; flex-direction:column; overflow-y:auto">
        <div style="display:flex; align-items:center; justify-content:space-between; padding:20px 20px 16px 24px">
          <div style="display:flex; flex-direction:column; gap:2px">
            <span style="font-size:15px; font-weight:700">履歴を追加</span>
            <span style="font-size:11.5px; color:#8a968a">株式会社サンプル商事</span>
          </div>
          <button sc-camel-on-click="{{ closeAdd }}" title="閉じる" style="width:30px; height:30px; border:none; border-radius:7px; background:transparent; color:#5a6660; display:flex; align-items:center; justify-content:center; cursor:pointer" style-hover="background:#EEF2EF; color:#1b1b1c"><svg width="12" height="12" sc-camel-view-box="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 2.5l9 9M11.5 2.5l-9 9"></path></svg></button>
        </div>

        <div style="display:flex; flex-direction:column; gap:20px; padding:4px 24px 24px">
          <div style="display:flex; flex-direction:column; gap:8px">
            <span style="font-size:12px; font-weight:600; color:#3c4642">種別</span>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px">
              <sc-for list="{{ kinds }}" as="k" hint-placeholder-count="2">
                <button sc-camel-on-click="{{ k.onClick }}" style="display:flex; align-items:center; gap:8px; height:40px; padding:0 12px; border-radius:8px; border:1px solid {{ k.border }}; background:{{ k.bg }}; font-family:inherit; font-size:12.5px; font-weight:600; color:{{ k.color }}; cursor:pointer">
                  <span style="width:10px; height:10px; border-radius:50%; box-sizing:border-box; border:{{ k.dotBorder }}; background:{{ k.dotBg }}"></span>{{ k.label }}
                </button>
              </sc-for>
            </div>
          </div>

          <sc-if value="{{ isOffering }}" hint-placeholder-val="{{ false }}">
            <label style="display:flex; flex-direction:column; gap:8px">
              <span style="font-size:12px; font-weight:600; color:#3c4642">紐づけるクレデンシャル</span>
              <sc-raw-select style="height:38px; padding:0 10px; border:1px solid #DDE2DD; border-radius:8px; background:#ffffff; font-family:inherit; font-size:13px; color:#1b1b1c">
                <option>テストクレデンシャル（2026/09/30）</option>
                <option>テストの件n（2026/09/30）</option>
                <option>紐づけない</option>
              </sc-raw-select>
            </label>
          </sc-if>

          <div style="display:flex; flex-direction:column; gap:8px">
            <span style="font-size:12px; font-weight:600; color:#3c4642">区分</span>
            <div style="display:flex; padding:3px; background:#EEF2EF; border-radius:8px; gap:2px">
              <sc-for list="{{ phases }}" as="ph" hint-placeholder-count="2">
                <button sc-camel-on-click="{{ ph.onClick }}" style="flex:1; height:30px; border:none; border-radius:6px; background:{{ ph.bg }}; box-shadow:{{ ph.shadow }}; color:{{ ph.color }}; font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer">{{ ph.label }}</button>
              </sc-for>
            </div>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
            <label style="display:flex; flex-direction:column; gap:8px">
              <span style="display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:#3c4642">予定日<span style="font-weight:500; color:#8a968a">{{ planNote }}</span></span>
              <input type="date" style="height:38px; box-sizing:border-box; padding:0 10px; border:1px solid #DDE2DD; border-radius:8px; background:#ffffff; font-family:'Azeret Mono',monospace; font-size:12.5px; color:#1b1b1c">
            </label>
            <label style="display:flex; flex-direction:column; gap:8px; opacity:{{ doneOpacity }}">
              <span style="display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:#3c4642">実施日<span style="font-weight:500; color:#8a968a">{{ doneNote }}</span></span>
              <input type="date" value="2026-09-30" disabled="{{ doneDisabled }}" style="height:38px; box-sizing:border-box; padding:0 10px; border:1px solid #DDE2DD; border-radius:8px; background:#ffffff; font-family:'Azeret Mono',monospace; font-size:12.5px; color:#1b1b1c">
            </label>
          </div>

          <div style="height:1px; background:#E8ECE8"></div>

          <label style="display:flex; flex-direction:column; gap:8px">
            <span style="font-size:12px; font-weight:600; color:#3c4642">名称</span>
            <input placeholder="例：営業本部長向け ブランド刷新のご提案" style="height:38px; box-sizing:border-box; padding:0 12px; border:1px solid #DDE2DD; border-radius:8px; background:#ffffff; font-family:inherit; font-size:13px; color:#1b1b1c; outline:none" style-focus="border-color:#36A191; box-shadow:0 0 0 3px rgba(54,161,145,.16)">
          </label>

          <div style="display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px">
            <label style="display:flex; flex-direction:column; gap:8px; min-width:0">
              <span style="font-size:12px; font-weight:600; color:#3c4642">氏名</span>
              <input placeholder="例：山田 太郎" style="height:38px; box-sizing:border-box; padding:0 12px; border:1px solid #DDE2DD; border-radius:8px; background:#ffffff; font-family:inherit; font-size:13px; color:#1b1b1c; outline:none; min-width:0" style-focus="border-color:#36A191; box-shadow:0 0 0 3px rgba(54,161,145,.16)">
            </label>
            <label style="display:flex; flex-direction:column; gap:8px; min-width:0">
              <span style="display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:#3c4642">役職<span style="font-weight:500; color:#8a968a">任意</span></span>
              <input placeholder="例：購買部 部長" style="height:38px; box-sizing:border-box; padding:0 12px; border:1px solid #DDE2DD; border-radius:8px; background:#ffffff; font-family:inherit; font-size:13px; color:#1b1b1c; outline:none; min-width:0" style-focus="border-color:#36A191; box-shadow:0 0 0 3px rgba(54,161,145,.16)">
            </label>
          </div>

          <label style="display:flex; flex-direction:column; gap:8px">
            <span style="display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:#3c4642">フリーコメント<span style="font-weight:500; color:#8a968a">任意</span></span>
            <textarea rows="5" placeholder="提案の背景や相手の反応など" style="box-sizing:border-box; padding:10px 12px; border:1px solid #DDE2DD; border-radius:8px; background:#ffffff; font-family:inherit; font-size:13px; line-height:1.7; color:#1b1b1c; resize:vertical; outline:none" style-focus="border-color:#36A191; box-shadow:0 0 0 3px rgba(54,161,145,.16)"></textarea>
          </label>
        </div>

        <div style="margin-top:auto; display:flex; justify-content:flex-end; gap:8px; padding:14px 24px; border-top:1px solid #EFF2EF; background:#ffffff">
          <button sc-camel-on-click="{{ closeAdd }}" style="height:36px; padding:0 16px; border:1px solid #DDE2DD; border-radius:8px; background:#ffffff; font-family:inherit; font-size:12.5px; font-weight:600; color:#1b1b1c; cursor:pointer" style-hover="background:#F4F6F4">キャンセル</button>
          <button style="height:36px; padding:0 20px; border:none; border-radius:8px; background:#36A191; font-family:inherit; font-size:12.5px; font-weight:600; color:#ffffff; cursor:pointer" style-hover="background:#2E8E80">追加する</button>
        </div>
      </aside>
    </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="">
class Component extends DCLogic {
  state = { open: {}, addOpen: false, kind: 'cred', phase: 'done' };
  renderVals() {
    const raw = [
      [
        { id: 'c1', kind: 'クレデンシャル', plan: '2026/09/30', done: '2026/09/30', role: '執行役員', person: 'テスト花子', name: 'テストクレデンシャル', comment: 'ここにテキストここにテキストここにテキストここにテキストここにテキストここにテキストここにテキストここにテキストここにテキストここにテキストここにテキストここにテキストここにテキストここにテキスト', created: '09/30 18:56', edited: '09/30 19:12', user: 'sample.user' },
        { id: 'o1', kind: 'オファリング', plan: '2026/09/30', done: '2026/09/30', role: 'システム部部長', person: 'テスト太郎', name: 'テストオファリング', comment: 'テストa', created: '09/30 18:54', edited: '09/30 19:05', user: 'sample.user' },
      ],
      [
        { id: 'c2', kind: 'クレデンシャル', plan: '—', done: '2026/09/30', role: '常務', person: 'テスト太郎', name: 'テストの件n', comment: '', created: '09/30 18:38', edited: '09/30 18:40', user: 'sample.user' },
      ],
    ];
    let count = 0;
    const groups = raw.map(list => ({ entries: list.map((e, idx) => {
      count++;
      const cred = e.kind === 'クレデンシャル';
      const isOpen = !!this.state.open[e.id];
      const isLong = e.comment.length > 60;
      return { ...e,
        initial: e.person.replace('テスト', '').slice(0, 1),
        hasComment: !!e.comment, isLong,
        clamp: isOpen || !isLong ? 'unset' : 2,
        toggleLabel: isOpen ? '折りたたむ' : 'すべて表示',
        chevron: isOpen ? 'rotate(180deg)' : 'none',
        toggle: () => this.setState(s => ({ open: { ...s.open, [e.id]: !s.open[e.id] } })),
        kindColor: cred ? '#1F5E55' : '#6B4FB8',
        dotBorder: cred ? 'none' : '3px solid #8B6FD6',
        dotBg: cred ? '#1F6E5E' : '#ffffff',
        rail: idx < list.length - 1 ? 'block' : 'none',
      };
    }) }));
    const st = this.state;
    const kinds = [['cred', 'クレデンシャル'], ['off', 'オファリング']].map(([k, label]) => {
      const on = st.kind === k, cred = k === 'cred';
      return { label, onClick: () => this.setState({ kind: k }),
        border: on ? (cred ? '#36A191' : '#8B6FD6') : '#DDE2DD',
        bg: on ? (cred ? '#EAF5F2' : '#F2EEFB') : '#ffffff',
        color: on ? (cred ? '#1F5E55' : '#5A3FA8') : '#5a6660',
        dotBorder: cred ? 'none' : '2.5px solid #8B6FD6', dotBg: cred ? '#1F6E5E' : '#ffffff' };
    });
    const phases = [['plan', '予定'], ['done', '実績']].map(([k, label]) => {
      const on = st.phase === k;
      return { label, onClick: () => this.setState({ phase: k }), bg: on ? '#ffffff' : 'transparent', shadow: on ? '0 1px 2px rgba(0,39,117,.12)' : 'none', color: on ? '#1b1b1c' : '#5a6660' };
    });
    const plan = st.phase === 'plan';
    return { groups, countLabel: count + '件', kinds, phases,
      addOpen: st.addOpen, modalMax: '1080px', bodyMin: st.addOpen ? '640px' : '0px',
      openAdd: () => this.setState({ addOpen: true }), closeAdd: () => this.setState({ addOpen: false }),
      isOffering: st.kind === 'off',
      planNote: plan ? '' : '任意', doneNote: plan ? '予定のため不要' : '',
      doneDisabled: plan, doneOpacity: plan ? 0.45 : 1 };
  }
}
</script>


</body></html>
